<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PoC-002 Web Speech</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        max-width: 720px;
        padding: 16px;
      }
      fieldset {
        display: grid;
        gap: 8px;
        grid-template-columns: max-content 1fr;
        align-items: center;
        margin-bottom: 16px;
      }
      select,
      input[type="text"] {
        min-width: 0;
        width: 100%;
      }
      button {
        font-size: 1.05rem;
        min-height: 48px;
        padding: 0 16px;
      }
      pre {
        background: color-mix(in srgb, currentColor 8%, transparent);
        font-size: 0.85rem;
        overflow-x: auto;
        padding: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>PoC-002 Web Speech</h1>
    <p>
      読み上げの立ち上がりと、重なったときの動きを測る。手順は docs/design/08-poc.md と
      spikes/poc-002-speech/README.md。最後に CSV を保存する。
    </p>

    <fieldset>
      <legend>声</legend>
      <label for="lang">言語</label>
      <select id="lang">
        <option value="ja-JP">ja-JP</option>
        <option value="en-US">en-US</option>
      </select>
      <label for="voice">声</label>
      <select id="voice"></select>
      <span></span>
      <span id="voices"></span>
      <label for="rate">速さ</label>
      <input id="rate" type="number" min="0.5" max="2" step="0.1" value="1.2" />
      <label for="volume">音量</label>
      <input id="volume" type="number" min="0" max="1" step="0.1" value="1" />
      <span></span>
      <button id="test" type="button">テスト再生</button>
    </fieldset>

    <fieldset>
      <legend>A 立ち上がり (speak から話し始めるまで)</legend>
      <label for="a-runs">回数</label>
      <input id="a-runs" type="number" min="1" max="200" value="50" />
      <label for="a-text">文</label>
      <input id="a-text" type="text" value="5秒後、全体攻撃" />
      <span></span>
      <button id="a-start" type="button">A を始める</button>
    </fieldset>
    <pre id="a-result">-</pre>

    <fieldset>
      <legend>B 重なり (3 つのコールを続ける)</legend>
      <label for="b-mode">方式</label>
      <select id="b-mode">
        <option value="interrupt">中断</option>
        <option value="queue">順番</option>
        <option value="priority">優先度 (1 normal、2 low、3 high)</option>
      </select>
      <label for="b-gap">間隔 (秒)</label>
      <select id="b-gap">
        <option value="0.3">0.3</option>
        <option value="1" selected>1</option>
        <option value="2">2</option>
      </select>
      <label for="b-runs">回数</label>
      <input id="b-runs" type="number" min="1" max="20" value="5" />
      <span></span>
      <button id="b-start" type="button">B を始める</button>
    </fieldset>
    <pre id="b-result">-</pre>

    <fieldset>
      <legend>C cancel の直後 (止めてすぐ次を話す)</legend>
      <label for="c-delay">cancel の後の間 (ms。B の中断にも使う)</label>
      <select id="c-delay">
        <option value="0">0</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="250">250</option>
      </select>
      <label for="c-runs">回数</label>
      <input id="c-runs" type="number" min="1" max="100" value="20" />
      <span></span>
      <button id="c-start" type="button">C を始める</button>
    </fieldset>
    <pre id="c-result">-</pre>

    <fieldset>
      <legend>D 長く鳴らし続ける (スマホ向け、画面を触らない)</legend>
      <label for="d-minutes">長さ (分)</label>
      <input id="d-minutes" type="number" min="1" max="120" value="30" />
      <label for="d-every">間隔 (秒)</label>
      <input id="d-every" type="number" min="3" max="120" value="20" />
      <label for="d-wakelock">Wake Lock</label>
      <input id="d-wakelock" type="checkbox" checked />
      <span></span>
      <span
        ><button id="d-start" type="button">D を始める</button>
        <button id="d-stop" type="button">止める</button></span
      >
    </fieldset>
    <pre id="d-result">-</pre>

    <p><button id="download" type="button">CSV を保存</button></p>

    <h2>出来事</h2>
    <pre id="log"></pre>
    <h2>環境</h2>
    <pre id="env"></pre>

    <script type="module" src="./main.js"></script>
  </body>
</html>
